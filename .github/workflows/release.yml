name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (build & test only, skip publish/tag)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    # Only run when the upstream CI succeeded on main, or on manual dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 2

      - name: Detect version change & enforce lockstep
        id: version
        run: |
          CHANGED=false
          UNIFIED=""
          MISMATCH=false
          for lib in types utils core screens ui; do
            CURRENT=$(node -e "console.log(require('./libs/$lib/package.json').version)")
            git show HEAD~1:libs/$lib/package.json > /tmp/prev.json 2>/dev/null || echo '{"version":"0.0.0"}' > /tmp/prev.json
            PREVIOUS=$(node -e "console.log(require('/tmp/prev.json').version)")

            echo "$lib: $PREVIOUS → $CURRENT"
            [ "$CURRENT" != "$PREVIOUS" ] && CHANGED=true

            if [ -z "$UNIFIED" ]; then
              UNIFIED="$CURRENT"
            elif [ "$CURRENT" != "$UNIFIED" ]; then
              MISMATCH=true
            fi
          done

          if [ "$MISMATCH" = "true" ]; then
            echo "::error::Lockstep violation — libs have mismatched versions. All 5 libs must share the same version (use 'npx nx release version <bump>')."
            exit 1
          fi

          echo "current=$UNIFIED" >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = "false" ]; then
            echo "No version change (all libs at $UNIFIED)"
          else
            echo "All libs aligned at $UNIFIED — release will proceed"
          fi

  release:
    needs: detect
    if: needs.detect.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@elasticias'

      - run: npm ci

      - name: Lint, test & typecheck
        run: npx nx run-many -t lint test typecheck --projects=types,utils,core,screens,ui

      - name: Build
        run: npx nx run-many -t build --projects=types,utils,core,screens,ui

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: npx nx release publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag commit
        if: ${{ !inputs.dry-run }}
        run: |
          TAG="v${{ needs.detect.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "ayoub.ezzouine-noreply@elasticias.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally."
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi
          git push origin "$TAG" || echo "Tag already on remote."

      - name: Create GitHub Release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect.outputs.version }}
          generate_release_notes: true
