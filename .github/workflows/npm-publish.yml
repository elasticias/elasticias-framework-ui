name: Publish

on:
  push:
    tags:
      - 'libs-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@elasticias'

      - run: npm ci

      - run: npx nx run-many -t build --projects=types,utils,core,screens,ui

      - run: npx nx release publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
