name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@elasticias'

      - run: npm ci

      - name: Lint, test & typecheck
        run: npx nx run-many -t lint test typecheck --projects=types,utils,core,screens,ui

      - name: Build
        run: npx nx run-many -t build --projects=types,utils,core,screens,ui

      - name: Publish
        run: npx nx release publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
