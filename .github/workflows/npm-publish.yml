name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (build & test only, skip publish)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@elasticias'

      - run: npm ci

      - name: Lint, test & typecheck
        run: npx nx run-many -t lint test typecheck --projects=types,utils,core,screens,ui

      - name: Build
        run: npx nx run-many -t build --projects=types,utils,core,screens,ui

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npx nx release publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
