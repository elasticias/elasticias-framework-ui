@if (labelKey || label) {
  <ef-label [labelKey]="labelKey" [label]="label" [for]="effectiveId" [required]="required" />
}
<div class="ef-field-control">
  <input
    [id]="effectiveId"
    [type]="type"
    pInputText
    [pSize]="size"
    [value]="value"
    (input)="handleInput($any($event.target).value)"
    (blur)="handleBlur()"
    [placeholder]="effectivePlaceholder"
    [attr.maxlength]="maxlength"
    [readonly]="readonly"
    [disabled]="disabled"
    [attr.autocomplete]="autocomplete"
    [class.ng-invalid]="isInvalid"
    [class.ng-touched]="ngControl?.touched"
    fluid
  />
  @if (showRequired) {
    <small class="text-danger">{{ 'validation.required' | translate }}</small>
  }
  @if (serverErrors; as errors) {
    @for (error of errors; track error) {
      <small class="text-danger block">{{ error }}</small>
    }
  }
</div>
