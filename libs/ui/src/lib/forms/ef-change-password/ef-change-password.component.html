<ef-form-grid>
  @if (requireCurrent()) {
    <ef-password
      class="col-12"
      name="currentPassword"
      labelKey="ef_change_password_current"
      autocomplete="current-password"
      required
      (valueChangeEvent)="currentPassword.set($event)"
    />
  }
  <ef-password
    class="col-6"
    name="newPassword"
    labelKey="ef_change_password_new"
    autocomplete="new-password"
    required
    (valueChangeEvent)="newPassword.set($event)"
  />
  <ef-password
    class="col-6"
    name="newPasswordConfirmation"
    labelKey="ef_change_password_confirm"
    autocomplete="new-password"
    required
    (valueChangeEvent)="confirmation.set($event)"
  />
</ef-form-grid>

@if (validationKeys().length || errors().length) {
  <ul class="ef-change-password__errors">
    @for (key of validationKeys(); track $index) {
      <li>{{ key | translate }}</li>
    }
    <!-- Server messages arrive already translated (Identity returns prose,
         not keys), so they are printed verbatim. -->
    @for (error of errors(); track $index) {
      <li>{{ error }}</li>
    }
  </ul>
}
