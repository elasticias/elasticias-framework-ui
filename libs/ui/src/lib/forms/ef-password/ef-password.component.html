@if (labelKey() || label()) {
  <ef-label [labelKey]="labelKey()" [label]="label()" [for]="effectiveId" [required]="required()" />
}
<div class="ef-field-control">
  <p-password
    [inputId]="effectiveId"
    [name]="name()"
    [ngModel]="value"
    [ngModelOptions]="{standalone: true}"
    (ngModelChange)="handleChange($event)"
    (onBlur)="handleBlur()"
    [toggleMask]="toggleMask"
    [feedback]="feedback"
    [placeholder]="effectivePlaceholder"
    [size]="size"
    [disabled]="isDisabled()"
    [attr.autocomplete]="autocomplete"
    [class.ng-invalid]="isInvalid"
    [class.ng-touched]="ngControl?.touched"
    [showClear]="canClear"
    (onClear)="clearValue()"
    styleClass="ef-password-field"
    fluid
  >
    <ng-template #clearicon>
      <span class="ef-clear">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </span>
    </ng-template>
  </p-password>
  @if (showRequired) {
    <small class="text-danger">{{ 'validation.required' | translate }}</small>
  }
  @if (serverErrors; as errors) {
    @for (error of errors; track error) {
      <small class="text-danger block">{{ error }}</small>
    }
  }
</div>
