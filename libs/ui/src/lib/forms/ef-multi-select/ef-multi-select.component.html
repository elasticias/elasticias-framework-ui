@if (labelKey || label) {
  <ef-label [labelKey]="labelKey" [label]="label" [for]="id" [required]="required" />
}
<div class="ef-field-control">
  <p-multiSelect
    [id]="id"
    [name]="name"
    [placeholder]="effectivePlaceholder"
    [options]="filteredOptions"
    [optionLabel]="optionLabel"
    [optionValue]="optionValue"
    [maxSelectedLabels]="maxSelectedLabels"
    [ngModel]="selectedValues"
    [ngModelOptions]="{standalone: true}"
    (ngModelChange)="onInternalModelChange($event)"
    (onClear)="handleClear()"
    [disabled]="disabled"
    [display]="display"
    [size]="size"
    [selectionLimit]="selectionLimit"
    [showClear]="showClear"
    fluid
  />
  @if (showRequired) {
    <small class="text-danger">{{ 'validation.required' | translate }}</small>
  }
  @if (serverErrors; as errors) {
    @for (error of errors; track error) {
      <small class="text-danger block">{{ error }}</small>
    }
  }
</div>
