<div class="seo-body">
    <p class="seo-note text-mute">{{ 'ef_seo_fields_fallback_hint' | translate }}</p>

    <ef-localized-input
        name="seoTitle"
        labelKey="ef_seo_fields_title_label"
        [value]="seoTitle()"
        [cultures]="cultures()"
        [maxLength]="titleMax()"
        [advisedLength]="titleAdvised()"
        counterHintKey="ef_seo_fields_counter_hint"
        counterOverKey="ef_seo_fields_over_hint"
        (valueChangeEvent)="seoChange.emit({ seoTitle: $event })"
    />

    <ef-localized-input
        name="seoDescription"
        mode="textarea"
        [rows]="3"
        labelKey="ef_seo_fields_description_label"
        [value]="seoDescription()"
        [cultures]="cultures()"
        [maxLength]="descriptionMax()"
        [advisedLength]="descriptionAdvised()"
        counterHintKey="ef_seo_fields_counter_hint"
        counterOverKey="ef_seo_fields_over_hint"
        (valueChangeEvent)="seoChange.emit({ seoDescription: $event })"
    />

    <ef-seo-preview
        labelKey="ef_seo_fields_preview"
        [contentLang]="previewCode()"
        [pageTitle]="previewTitle()"
        [url]="previewUrl()"
        [description]="previewDescription()"
    />
</div>
