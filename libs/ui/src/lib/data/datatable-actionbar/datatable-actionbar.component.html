<div class="flex justify-end" role="toolbar" tabindex="0" (click)="$event.stopPropagation()" (keyup.enter)="$event.stopPropagation()">
  @if (duplicateButton) {
    <ef-button
      icon="pi pi-copy"
      severity="primary"
      styleClass="action-btn"
      tooltipKey="common.duplicate"
      (clickEvent)="duplicateAction()" />
  }
  @if (editButton && hasEditPermission) {
    <ef-button
      icon="pi pi-pencil"
      severity="primary"
      styleClass="action-btn"
      size="small"
      tooltipKey="common.edit"
      (clickEvent)="editAction()" />
  }
  @if (deleteButton && hasDeletePermission) {
    <ef-button
      icon="pi pi-trash"
      severity="primary"
      styleClass="action-btn"
      size="small"
      tooltipPosition="top"
      tooltipKey="common.delete"
      (clickEvent)="deleteAction()" />
  }
</div>
