@if (hasGroups()) {
  <p-fieldset [legend]="resolvedLegend()">
    <div class="ef-order-summary">
      <div class="ef-order-summary__content">
        @for (column of columnGroups(); track $index) {
          <div class="ef-order-summary__column">
            @for (group of column; track group.code) {
              <div class="ef-order-summary__item">
                <span class="ef-order-summary__label">{{ group.label }}:</span>
                <span class="ef-order-summary__count">{{ group.count }}</span>
              </div>
            }
          </div>
        }
      </div>
      <div class="ef-order-summary__footer">
        <span class="ef-order-summary__total-label">{{ totalLabelKey() | translate }}</span>
        <span class="ef-order-summary__total-count">{{ totalCount() }}</span>
      </div>
    </div>
  </p-fieldset>
}
