<nav class="ef-module-rail" aria-label="Modules">
  <div class="ef-module-rail__logo-slot">
    <ng-content select="[logo]"></ng-content>
  </div>

  @for (row of rows(); track trackRow($index, row)) {
    @if (row.kind === 'divider') {
      <span class="ef-module-rail__divider" aria-hidden="true"></span>
    } @else {
      <button
        type="button"
        class="ef-module-rail__btn"
        [class.is-active]="activeId() === row.module.id"
        [attr.data-module]="row.module.id"
        [attr.aria-current]="activeId() === row.module.id ? 'page' : null"
        [style.--m-color]="'var(--' + row.module.accent + ')'"
        [pTooltip]="row.module.labelKey | translate"
        tooltipPosition="right"
        (click)="onSelect(row.module)"
      >
        <i class="ef-module-rail__icon" [class]="row.module.icon" aria-hidden="true"></i>

        @if (badgeFor(row.module.id); as badge) {
          <span class="ef-module-rail__badge">{{ badge }}</span>
        }

        <span class="ef-module-rail__sr">{{ row.module.labelKey | translate }}</span>
      </button>
    }
  }
</nav>
