<div class="ef-pill-group" [ngClass]="fadeClass()">
  <div
    #scroller
    class="ef-pill-group__track"
    role="tablist"
    [attr.aria-label]="ariaLabelKey() | translate"
    (scroll)="onScroll()"
  >
    @for (item of items(); track trackValue($index, item)) {
      <button
        type="button"
        class="ef-pill"
        role="tab"
        [class.is-active]="item.value === value()"
        [attr.aria-selected]="item.value === value()"
        (click)="select(item)"
      >
        <span class="ef-pill__label">{{ item.labelKey | translate }}</span>
        @if (!hideCounts() && item.count !== undefined) {
          <span class="ef-pill__sep" aria-hidden="true">·</span>
          <span class="ef-pill__count">{{ item.count }}</span>
        }
      </button>
    }
  </div>
</div>
