<div class="ef-app-top__slot ef-app-top__slot--breadcrumb">
  <ng-content select="[breadcrumb]"></ng-content>
  @if (hasBreadcrumb()) {
    <nav class="ef-app-top__crumb" aria-label="breadcrumb">
      <span class="ef-app-top__crumb-dot" [attr.data-module]="module()!.id" aria-hidden="true"></span>
      <span class="ef-app-top__crumb-root">{{ module()!.labelKey | translate }}</span>
      @if (navItem(); as item) {
        <span class="ef-app-top__crumb-sep" aria-hidden="true">/</span>
        <span class="ef-app-top__crumb-leaf">{{ item.labelKey | translate }}</span>
      }
    </nav>
  }
</div>

<div class="ef-app-top__slot ef-app-top__slot--actions">
  <ng-content select="[actions]"></ng-content>
  @if (themeToggle()) {
    <ef-theme-toggle />
  }
  @if (logout() && session) {
    <button
      type="button"
      class="ef-app-top__logout"
      [attr.aria-label]="'common_logout' | translate"
      [attr.title]="'common_logout' | translate"
      (click)="signOut()"
    >
      <i class="pi pi-sign-out" aria-hidden="true"></i>
    </button>
  }
</div>
