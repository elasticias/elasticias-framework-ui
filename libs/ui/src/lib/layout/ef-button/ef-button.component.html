<p-button
  [label]="labelKey ? (labelKey | translate) : label"
  [icon]="icon"
  [severity]="severity"
  [size]="size"
  [disabled]="disabled"
  [rounded]="rounded"
  [outlined]="outlined"
  [raised]="raised"
  [text]="text"
  [loading]="loading"
  [styleClass]="styleClass"
  [type]="type"
  [badge]="badge"
  [badgeSeverity]="badgeSeverity"
  [pTooltip]="tooltipKey ? (tooltipKey | translate) : tooltip"
  [tooltipPosition]="tooltipPosition"
  (click)="handleClick($event)"
/>
