@if (variant() === 'chip') {
  <ef-profile-chip
    [name]="name()"
    [role]="chipRole()"
    [initial]="initial()"
    [tone]="tone()"
    (clickEvent)="op.toggle($event)"
  />
  <p-popover #op styleClass="ef-profile-menu__panel" appendTo="body">
    <ng-container *ngTemplateOutlet="panel; context: { $implicit: op }" />
  </p-popover>
} @else {
  <ng-container *ngTemplateOutlet="panel" />
}

<ng-template #panel let-op>
  <div class="ef-profile-menu__head">
    @if (name()) {
      <span class="ef-profile-menu__name">{{ name() }}</span>
    }
    @if (secondary()) {
      <span class="ef-profile-menu__secondary">{{ secondary() }}</span>
    }
  </div>

  <ul class="ef-profile-menu__list">
    @for (item of items(); track item.id) {
      <li [class.is-group-start]="item.groupStart">
        <button
          type="button"
          class="ef-profile-menu__item"
          [class.is-danger]="item.severity === 'danger'"
          [attr.aria-expanded]="item.children?.length ? isExpanded(item.id) : null"
          (click)="select(item, op)"
        >
          @if (item.icon) {
            <i [class]="item.icon" aria-hidden="true"></i>
          }
          <span class="ef-profile-menu__label">{{ item.labelKey | translate }}</span>
          @if (item.badge !== undefined && item.badge !== null) {
            <span class="ef-profile-menu__badge">{{ item.badge }}</span>
          }
          @if (item.children?.length) {
            <i
              class="ef-profile-menu__caret pi"
              [class.pi-chevron-down]="!isExpanded(item.id)"
              [class.pi-chevron-up]="isExpanded(item.id)"
              aria-hidden="true"
            ></i>
          }
        </button>

        @if (item.children?.length && isExpanded(item.id)) {
          <ul class="ef-profile-menu__sublist">
            @for (child of item.children; track child.id) {
              <li>
                <button
                  type="button"
                  class="ef-profile-menu__item is-child"
                  (click)="select(child, op)"
                >
                  @if (child.icon) {
                    <i [class]="child.icon" aria-hidden="true"></i>
                  }
                  <span class="ef-profile-menu__label">{{ child.labelKey | translate }}</span>
                </button>
              </li>
            }
          </ul>
        }
      </li>
    }
  </ul>
</ng-template>
